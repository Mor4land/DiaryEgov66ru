services:
  miragediary:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: miragediary
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - path: .env
        required: false
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - TZ=Asia/Yekaterinburg
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/miragediary.db
      - MIRAGE_SQLITE_CONNECTION=Data Source=/app/data/miragediary.db
    volumes:
      # Persistent storage for SQLite database, token keys, and automated backups
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5000/privacy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
